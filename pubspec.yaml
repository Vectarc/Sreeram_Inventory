name: sreeramcompany
description: "Sree Ram Company"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.0.0
  provider: ^6.0.0
  image_picker: ^1.0.0
  shared_preferences: ^2.2.2   # ← NEW: saves JWT token across app restarts
  google_fonts: ^6.2.1         # ← Poppins font support
  dropdown_search: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
